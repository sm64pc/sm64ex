name: Build sm64ex UWP

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  uwp:
    runs-on: windows-latest

    steps:
      # 1. Checkout your code
      - name: 🛠️ Checkout code
        uses: actions/checkout@v4

      # 2. Fetch upstream UWP CMake port from coop-deluxe/sm64coopdx
      - name: 🌐 Download sm64coopdx ZIP
        shell: bash
        run: |
          curl -L https://github.com/coop-deluxe/sm64coopdx/archive/refs/heads/main.zip -o upstream.zip
          unzip -q upstream.zip
          # Copy just the platform/uwp folder into our workspace
          rm -rf platform/uwp
          mkdir -p platform/uwp
          cp -r sm64coopdx-main/platform/uwp/* platform/uwp/

      # 3. Apply Render96EX feature flags
      - name: ✏️ Enable RENDER96, WIDESCREEN & LUIGI
        shell: bash
        run: |
          sed -i 's|// #define RENDER96|#define RENDER96|' include/config.h
          sed -i 's|// #define WIDESCREEN|#define WIDESCREEN|' include/config.h
          sed -i 's|// #define ENABLE_LUIGI_COOP|#define ENABLE_LUIGI_COOP|' include/config.h

      # 4. Cache & fetch the HD texture pack
      - name: Cache Render96 textures
        id: cache
        uses: actions/cache@v4
        with:
          path: temp
          key: render96-pack-${{ runner.os }}
          restore-keys: render96-pack-
      - name: 🎨 Fetch Render96 textures
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf temp
          curl -L https://github.com/pokeheadroom/RENDER96-HD-TEXTURE-PACK/archive/refs/heads/master.zip -o textures.zip
          unzip -q -o textures.zip -d temp

      # 5. Install textures into UWP assets
      - name: 🚚 Install Render96 textures
        shell: bash
        run: |
          mkdir -p platform/uwp/Assets/Render96
          cp -r temp/*/gfx/* platform/uwp/Assets/Render96/

      # 6. Configure with CMake for UWP
      - name: ⚙️ Configure with CMake
        shell: bash
        run: |
          cmake -B build-uwp -S platform/uwp \
            -G "Visual Studio 17 2022" -A x64 -T host=x64 \
            -DCMAKE_SYSTEM_NAME=WindowsStore \
            -DCMAKE_SYSTEM_VERSION=10.0.19041.0

      # 7. Build (Release)
      - name: 🏗️ Build (Release)
        shell: bash
        run: cmake --build build-uwp --config Release --parallel 8

      # 8. Package & Sign
      - name: 📦 Package & Sign
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=sm64ex" -Type CodeSigningCert -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(10)
          Export-Certificate -Cert $cert -FilePath sm64ex-devcert.cer
          Compress-Archive -Path build-uwp\AppxLayout\* -DestinationPath sm64ex.appx
          SignTool.exe sign /fd SHA256 /n "sm64ex" sm64ex.appx

      # 9. Upload artifacts
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uwp-build
          path: |
            sm64ex.appx
            sm64ex-devcert.cer
